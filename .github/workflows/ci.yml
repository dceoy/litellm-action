---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  release:
    types:
      - released
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required for manual runs
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint-and-test
          - update
        description: Choose the workflow to run
        default: lint-and-test
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  typescript-lint-and-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-test')
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/typescript-package-script.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      package-scripts: lint,typecheck,format:check,test
      package-path: .
      node-version: latest
      audit: false
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-test')
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .github/workflows
  github-actions-e2e-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-test')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-test.yml
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  github-codeql-analysis:
    if: >
      github.event_name == 'push'
    uses: dceoy/gha-for-devops/.github/workflows/github-codeql-analysis.yml@main   # zizmor: ignore[unpinned-uses]
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      language: >
        ["javascript"]
  github-major-version-tag:
    if: >
      (github.event_name == 'release' && github.event.action == 'released')
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-major-version-tag.yml@main  # zizmor: ignore[unpinned-uses]
  build-and-update-dist:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'update')
    needs:
      - typescript-lint-and-test
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: latest
      - name: Install dependencies
        run: >
          pnpm install --frozen-lockfile
      - name: Refresh vulnerable dependencies
        run: >
          pnpm update @actions/cache@6.2.0 @actions/core@3.0.1 jest@30.4.2
      - name: Apply transitive security override
        run: |
          pnpm config set --location=project --json overrides \
            "$(pnpm config get --json overrides | jq -c '. + {"js-yaml@>=5.0.0 <=5.2.1":"5.2.2"}')"
          pnpm install --no-frozen-lockfile
      - name: Verify security audit
        run: >
          pnpm run audit
      - name: Build the project
        run: >
          pnpm run build
      - name: Format the generated files
        run: >
          pnpm format
      - name: Lint the generated files
        run: >
          pnpm lint:fix
      - name: Run type checks
        run: >
          pnpm run typecheck
      - name: Run tests
        run: >
          pnpm run test
      - name: Commit and push the changes
        uses: EndBug/add-and-commit@645ecc0dd0a57f4d86d26c0aa5fc42c0a856fbca  # v11.0.0
        with:
          add: ./dist ./package.json ./pnpm-lock.yaml ./pnpm-workspace.yaml
          message: Update dist and dependency files
          push: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - typescript-lint-and-test
      - github-actions-lint-and-scan
      - build-and-update-dist
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      unconditional: true
